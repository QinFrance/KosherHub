name: Kotlin catalog, mirrors and website
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Validate backend
        run: gradle :backend:test --no-daemon
      - name: Refresh trusted sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :backend:run --args='--sync' --no-daemon
      - name: Mirror explicitly approved releases with license and notices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :backend:run --args='--mirror' --no-daemon
      - name: Export generated API snapshot
        run: gradle :backend:run --args='--export' --no-daemon
      - name: Compile Compose HTML
        run: gradle :frontend:jsBrowserDistribution --no-daemon
      - name: Prepare GitHub Pages
        run: |
          mkdir -p docs
          cp -R frontend/build/dist/js/productionExecutable/. docs/
          touch docs/.nojekyll
          find docs -name "*.map" -delete
      - name: Publish catalog and website
        run: |
          git config user.name 'kosherhub-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json frontend/src/jsMain/resources/catalog.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified catalog and Kotlin website [skip ci]'
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
