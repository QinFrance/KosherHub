name: Kotlin catalog, mirrors and website
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Mirror firmware releases']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Validate Kotlin backend and ingestion
        run: gradle :backend:test --no-daemon
      - name: Refresh trusted sources
        run: gradle :backend:run --args='--sync' --no-daemon
      - name: Host approved APKs with licenses and corresponding source
        run: gradle :backend:run --args='--mirror' --no-daemon
      - name: Reconstruct pinned local logos and font
        run: gradle :backend:run --args='--assets' --no-daemon
      - name: Export catalog including verified hosted firmware
        run: gradle :backend:run --args='--export' --no-daemon
      - name: Compile Kotlin WebAssembly and Material 3 Expressive
        run: gradle :frontend:wasmJsBrowserDistribution --no-daemon
      - name: Prepare Pages artifact
        run: |
          touch frontend/build/dist/wasmJs/productionExecutable/.nojekyll
          find frontend/build/dist/wasmJs/productionExecutable -name '*.map' -delete
      - name: Save refreshed catalog
        run: |
          git config user.name 'kosherhub-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/cfop-catalog.json frontend/src/jsMain/resources/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified catalog [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/dist/wasmJs/productionExecutable
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
