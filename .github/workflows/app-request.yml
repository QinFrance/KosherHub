name: Validate app issue
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.event.issue.title, '[App]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Validate upstream metadata and prepare review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :backend:validateAppIssue --console=plain
